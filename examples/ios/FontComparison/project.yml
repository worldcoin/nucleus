name: FontComparison
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Nucleus:
    path: ../../..
targets:
  FontComparison:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Nucleus
        product: NucleusFonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worldcoin.nucleus.fontcomparison
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Font Comparison
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
schemes:
  FontComparison:
    build:
      targets:
        FontComparison: all
