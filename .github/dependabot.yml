# Based on worldcoin/security dependencies/standards/npm.yml.
# Updates open pull requests for manual review and merge.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/examples/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[npm] "
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]
      npm-minor:
        patterns: ["*"]
        update-types: ["minor"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
